<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../Logo/Favicon.jpeg" type="image/jpeg">
    <title>Catálogo Completo - Salsamentaria Sofi</title>
    <!-- Referencia al CSS retrocediendo un nivel -->
    <link rel="stylesheet" href="../css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .catalogo-header {
            padding-top: 120px;
            padding-bottom: 40px;
            text-align: center;
            background: var(--bg-color);
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="logo" style="display: flex; align-items: center; gap: 10px;">
            <img src="../Logo/Favicon.jpeg" alt="Salsamentaria Sofi" style="height: 50px; border-radius: 50%;">
            Salsamentaria<span>Sofi</span>
        </div>
        <ul class="nav-links">
            <li><a href="../index.html">Inicio</a></li>
            <li><a href="nosotros.html">Misión y Visión</a></li>
            <li><a href="productos.html">Productos</a></li>
            <li><a href="promociones.html">Promociones</a></li>
            <li><a href="contacto.html">Contacto</a></li>
            <li><a href="integrantes.html">Integrantes</a></li>
            <li><a href="resenas.html">Reseñas</a></li>
            <li><a href="admin.html" class="admin-nav-link"><i class="fas fa-lock"></i> Admin</a></li>
        </ul>
        <div class="hamburger"><i class="fas fa-bars"></i></div>
    </nav>

    <div class="catalogo-header">
        <div class="section-header">
            <h2>Catálogo Completo de Productos</h2>
            <p>Explora toda nuestra variedad disponible en tienda.</p>
        </div>
    </div>

    <section style="padding-top: 0;" class="products">
        <div class="product-grid" id="full-catalog">
            <!-- Grid poblado dinámicamente desde JavaScript -->
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Salsamentaria Sofi. Todos los derechos reservados.</p>
    </footer>

    <!-- WhatsApp Floating Button -->
    <a href="https://api.whatsapp.com/send?phone=573204867044&text=Hola,%20quisiera%20pedir%20algo%20del%20cat%C3%A1logo." class="whatsapp-float" target="_blank" title="Hacer pedido por WhatsApp">
        <i class="fab fa-whatsapp"></i>
    </a>

    <!-- Botón flotante del carrito -->
    <div class="cart-float-btn" id="cart-float-btn">
        <i class="fas fa-shopping-cart"></i>
        <div class="cart-badge" id="cart-badge">0</div>
    </div>

    <!-- Overlay del carrito -->
    <div class="cart-overlay" id="cart-overlay"></div>

    <!-- Sidebar del carrito -->
    <div class="cart-sidebar" id="cart-sidebar">
        <div class="cart-header">
            <h3>Tu Pedido</h3>
            <button class="close-cart" id="close-cart"><i class="fas fa-times"></i></button>
        </div>
        <div class="cart-items" id="cart-items">
            <!-- Los items del carrito se renderizan aquí -->
        </div>
        <div class="cart-footer">
            <div class="cart-total">
                <span>Total:</span>
                <span id="cart-total-price">$0</span>
            </div>
            <button class="whatsapp-order-btn" id="whatsapp-order-btn">
                <i class="fab fa-whatsapp"></i> Generar Pedido
            </button>
        </div>
    </div>

    <script src="../js/script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const catalog = document.getElementById('full-catalog');
            if (!catalog) return;

            const catalogProducts = (typeof getStoredProducts === 'function') 
                ? getStoredProducts() 
                : (window.initialProducts || []);

            const categories = [...new Set(catalogProducts.map(p => p.category))];

            catalog.innerHTML = '';
            categories.forEach(cat => {
                const catProducts = catalogProducts.filter(p => p.category === cat);
                if (catProducts.length === 0) return;

                const title = document.createElement('h3');
                title.style.gridColumn = '1 / -1';
                title.style.marginTop = '2rem';
                title.style.marginBottom = '1rem';
                title.style.textTransform = 'capitalize';
                title.style.fontSize = '2.5rem';
                title.style.color = 'var(--primary-color)';
                title.textContent = cat;
                catalog.appendChild(title);

                catProducts.forEach(product => {
                    const card = document.createElement('div');
                    card.className = 'product-card';
                    
                    const formattedPrice = new Intl.NumberFormat('es-CO', { 
                        style: 'currency', 
                        currency: 'COP', 
                        minimumFractionDigits: 0 
                    }).format(product.price);
                    
                    card.innerHTML = `
                        <img src="${product.image}" alt="${product.name}" onerror="this.src='../Logo/Favicon.jpeg'">
                        <h3>${product.name}</h3>
                        <p class="desc">${product.unit}</p>
                        <div class="price"><span class="new-price">${formattedPrice}</span></div>
                        <button class="add-to-cart-btn" onclick="addToCart(${product.id})">Agregar al carrito</button>
                    `;
                    catalog.appendChild(card);
                });
            });
        });
    </script>
</body>
</html>
