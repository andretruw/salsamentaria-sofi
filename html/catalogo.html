        document.addEventListener('DOMContentLoaded', () => {
            const catalog = document.getElementById('full-catalog');
            
            allProducts.forEach(product => {
                if(product.image.includes('/EMBUTIOS/')) product.category = 'Embutidos';
                else if(product.image.includes('/salsas/')) product.category = 'Salsas';
                else if(product.image.includes('/LACTEOS/')) product.category = 'Lácteos';
                else if(product.image.includes('/desechables/')) product.category = 'Desechables';
                else if(product.image.includes('/PANADERIA/')) product.category = 'Panadería';
                else product.category = 'Otros';
            });
            
            const categories = [...new Set(allProducts.map(p => p.category))];
            categories.forEach(cat => {
                const catProducts = allProducts.filter(p => p.category === cat);
                if (catProducts.length === 0) return;

                const title = document.createElement('h3');
                title.style.gridColumn = '1 / -1';
                title.style.marginTop = '2rem';
                title.style.marginBottom = '1rem';
                title.style.textTransform = 'capitalize';
                title.style.fontSize = '2.5rem';
                title.style.color = 'var(--primary-color)';
                title.textContent = cat;
                catalog.appendChild(title);

                catProducts.forEach(product => {
                    const card = document.createElement('div');
                    card.className = 'product-card';
                    
                    const formattedPrice = new Intl.NumberFormat('es-CO', { 
                        style: 'currency', 
                        currency: 'COP', 
                        minimumFractionDigits: 0 
                    }).format(product.price);
                    
                    card.innerHTML = `
                        <img src="${product.image}" alt="${product.name}">
                        <h3>${product.name}</h3>
                        <p class="desc">${product.unit}</p>
                        <div class="price"><span class="new-price">${formattedPrice}</span></div>
                    `;
                    catalog.appendChild(card);
                });
            });
        });
    </script>
